<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RestoCheck | Biometric Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: white; }
        .btn-glow { transition: 0.3s; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        .btn-glow:active { transform: scale(0.95); opacity: 0.9; }
        .admin-input { background: #1e293b; border: 1px solid #334155; color: white; text-align: center; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="p-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-500 p-2 rounded-lg">
                <i data-lucide="chef-hat" class="w-5 h-5 text-white"></i>
            </div>
            <span class="font-extrabold text-xl tracking-tight">RestoCheck</span>
        </div>
        <button onclick="openAdmin()" class="text-slate-400 hover:text-white"><i data-lucide="lock" class="w-6 h-6"></i></button>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 space-y-8">
        
        <!-- User Info -->
        <div class="text-center" id="user-display">
            <h2 class="text-3xl font-extrabold" id="staff-name">---</h2>
            <p class="text-indigo-400 font-bold tracking-widest text-sm" id="staff-id">ID: ---</p>
        </div>

        <!-- Network Shield -->
        <div id="net-shield" class="flex items-center gap-3 bg-red-500/10 border border-red-500/20 px-6 py-3 rounded-full text-red-500 text-xs font-bold">
            <i data-lucide="shield-alert" class="w-4 h-4"></i>
            OUTSIDE RESTAURANT NETWORK
        </div>

        <!-- THE SENSOR BUTTON -->
        <div class="relative">
            <div id="ring-anim" class="absolute inset-0 rounded-full bg-indigo-500/20 scale-125 hidden animate-ping"></div>
            <button id="scan-btn" onclick="startBiometricAuth()" disabled 
                class="relative w-56 h-56 rounded-full bg-slate-800 border-4 border-slate-700 flex flex-col items-center justify-center gap-4 transition-all duration-500">
                <i data-lucide="fingerprint" id="finger-icon" class="w-20 h-20 text-slate-600"></i>
                <span class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500" id="btn-text">Check WiFi</span>
            </button>
        </div>

        <p class="text-slate-500 text-xs text-center max-w-[200px]">Connected to restaurant internet to enable biometric scanner</p>
    </main>

    <!-- Modal: Registration -->
    <div id="reg-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 w-full max-w-sm rounded-[3rem] p-10 border border-slate-800">
            <h3 class="text-2xl font-black mb-2">Staff Setup</h3>
            <p class="text-slate-400 text-sm mb-8">Enter your details to register this device for attendance.</p>
            <input type="text" id="reg-name" placeholder="Full Name" class="w-full admin-input py-4 rounded-2xl mb-4 focus:ring-2 ring-indigo-500 outline-none">
            <input type="text" id="reg-id" placeholder="Employee ID" class="w-full admin-input py-4 rounded-2xl mb-8 focus:ring-2 ring-indigo-500 outline-none">
            <button onclick="saveRegistration()" class="w-full btn-glow py-4 rounded-2xl font-black uppercase tracking-widest text-sm text-white">Register Device</button>
        </div>
    </div>

    <!-- Modal: Admin PIN -->
    <div id="admin-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-6 hidden">
        <div class="bg-slate-900 w-full max-w-xs rounded-[3rem] p-10 text-center border border-slate-800">
            <h3 class="text-xl font-black mb-6">Admin Access</h3>
            <input type="password" id="pin-input" maxlength="4" placeholder="••••" class="w-full admin-input text-4xl py-4 rounded-2xl mb-6 outline-none">
            <div class="flex gap-2">
                <button onclick="closeAdmin()" class="flex-1 bg-slate-800 py-4 rounded-2xl font-bold">Back</button>
                <button onclick="verifyPin()" class="flex-1 btn-glow py-4 rounded-2xl font-bold">Login</button>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="fixed inset-0 bg-slate-950 z-[60] p-6 overflow-y-auto hidden">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black uppercase italic">Dashboard</h2>
            <button onclick="closePanel()" class="bg-slate-800 p-3 rounded-full"><i data-lucide="x"></i></button>
        </div>
        
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                <p class="text-slate-500 text-[10px] font-black uppercase mb-1">Total Records</p>
                <p id="count-total" class="text-3xl font-black text-indigo-400">0</p>
            </div>
            <button onclick="downloadExcel()" class="bg-indigo-600 p-6 rounded-3xl flex flex-col items-center justify-center gap-2">
                <i data-lucide="file-spreadsheet"></i>
                <span class="text-[10px] font-black uppercase">Export Excel</span>
            </button>
        </div>

        <div class="bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-800/50">
                    <tr>
                        <th class="p-4 font-black uppercase text-slate-500">Employee</th>
                        <th class="p-4 font-black uppercase text-slate-500">In/Out</th>
                    </tr>
                </thead>
                <tbody id="log-table" class="divide-y divide-slate-800"></tbody>
            </table>
        </div>
        <button onclick="clearLogs()" class="w-full mt-10 py-4 text-red-500/50 text-[10px] font-black uppercase tracking-widest">Clear Database</button>
    </div>

    <script>
        const TARGET_IP = "192.168.1.1";
        const ADMIN_PIN = "7530";
        let logs = JSON.parse(localStorage.getItem('logs')) || [];
        let staff = JSON.parse(localStorage.getItem('staff')) || null;

        // --- Initialization ---
        window.onload = () => {
            lucide.createIcons();
            if (!staff) document.getElementById('reg-modal').classList.remove('hidden');
            else {
                document.getElementById('staff-name').innerText = staff.name;
                document.getElementById('staff-id').innerText = `ID: ${staff.id}`;
            }
            checkNetwork();
        };

        // --- Network Check ---
        async function checkNetwork() {
            const shield = document.getElementById('net-shield');
            const btn = document.getElementById('scan-btn');
            const icon = document.getElementById('finger-icon');
            const txt = document.getElementById('btn-text');

            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                const myIp = data.ip;

                // SIMULATION: If IP is yours OR matches a 192 local range
                if (myIp === TARGET_IP || myIp.startsWith("192.") || myIp.startsWith("10.")) {
                    shield.className = "flex items-center gap-3 bg-indigo-500/10 border border-indigo-500/20 px-6 py-3 rounded-full text-indigo-400 text-xs font-bold";
                    shield.innerHTML = `<i data-lucide="shield-check" class="w-4 h-4"></i> RESTAURANT NETWORK ACTIVE`;
                    btn.disabled = false;
                    btn.classList.add('btn-glow', 'border-indigo-400');
                    btn.classList.remove('bg-slate-800', 'border-slate-700');
                    icon.classList.replace('text-slate-600', 'text-white');
                    txt.innerText = "Scan Finger";
                    txt.classList.replace('text-slate-500', 'text-white');
                    document.getElementById('ring-anim').classList.remove('hidden');
                }
            } catch (e) { console.log("Network check failed"); }
            lucide.createIcons();
        }

        // --- THE SENSOR LOGIC ---
        async function startBiometricAuth() {
            // Check if HTTPS
            if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                alert("Security Error: Biometric scanning requires an HTTPS connection (GitHub Pages).");
                return;
            }

            try {
                // We use navigator.credentials.create to force the native OS sensor popup
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const publicKeyCredentialCreationOptions = {
                    challenge: challenge,
                    rp: { name: "RestoCheck", id: window.location.hostname },
                    user: {
                        id: Uint8Array.from(staff.id, c => c.charCodeAt(0)),
                        name: staff.name,
                        displayName: staff.name
                    },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                    timeout: 60000
                };

                // THIS TRIGGER IS THE ACTUAL POPUP
                await navigator.credentials.create({ publicKey: publicKeyCredentialCreationOptions });
                
                // If the code reaches here, the user successfully scanned their finger
                confirmCheck();

            } catch (err) {
                // If user cancels or device has no fingerprint set up
                console.error(err);
                if (err.name === 'NotAllowedError') {
                    alert("Verification Failed: Biometric was canceled or timed out.");
                } else {
                    // Fail-safe for desktop/unsupported browsers: Allow manual verification
                    if(confirm("Native sensor issue. Verify manually as " + staff.name + "?")) {
                        confirmCheck();
                    }
                }
            }
        }

        function confirmCheck() {
            const now = new Date();
            const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            const date = now.toLocaleDateString();

            let openLog = logs.find(l => l.date === date && l.out === '--' && l.id === staff.id);

            if (openLog) {
                openLog.out = time;
            } else {
                logs.push({ name: staff.name, id: staff.id, date: date, in: time, out: '--' });
            }

            localStorage.setItem('logs', JSON.stringify(logs));
            document.getElementById('scan-btn').classList.replace('btn-glow', 'bg-emerald-500');
            document.getElementById('btn-text').innerText = "Verified!";
            setTimeout(() => location.reload(), 2000);
        }

        // --- Admin Functions ---
        function openAdmin() { document.getElementById('admin-modal').classList.remove('hidden'); }
        function closeAdmin() { document.getElementById('admin-modal').classList.add('hidden'); }
        function verifyPin() {
            if (document.getElementById('pin-input').value === ADMIN_PIN) {
                document.getElementById('admin-modal').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminData();
            } else { alert("Wrong PIN"); }
        }
        function closePanel() { document.getElementById('admin-panel').classList.add('hidden'); }
        
        function loadAdminData() {
            const table = document.getElementById('log-table');
            table.innerHTML = '';
            logs.slice().reverse().forEach(l => {
                table.innerHTML += `<tr>
                    <td class="p-4 font-bold">${l.name}<br><span class="text-[8px] text-slate-500">${l.date}</span></td>
                    <td class="p-4 font-mono text-indigo-400">IN: ${l.in}<br><span class="text-orange-400">OUT: ${l.out}</span></td>
                </tr>`;
            });
            document.getElementById('count-total').innerText = logs.length;
        }

        function downloadExcel() {
            const ws = XLSX.utils.json_to_sheet(logs);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Attendance");
            XLSX.writeFile(wb, "Attendance_Report.xlsx");
        }

        function saveRegistration() {
            const name = document.getElementById('reg-name').value;
            const id = document.getElementById('reg-id').value;
            if (name && id) {
                localStorage.setItem('staff', JSON.stringify({ name, id }));
                location.reload();
            }
        }

        function clearLogs() { if(confirm("Delete all data?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
