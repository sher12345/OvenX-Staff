<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OvenX Staff Attendance</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; background:#111; color:#fff; }
    header { background:#c62828; padding:20px; text-align:center; font-size:26px; }
    header::after { content:" 🔥🍕"; }
    .section { max-width:600px; margin:20px auto; padding:25px; background:#222; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.5); }
    input, button { width:100%; padding:15px; margin:10px 0; font-size:18px; border-radius:8px; border:none; }
    input { background:#333; color:white; }
    button { background:#43a047; color:white; cursor:pointer; font-weight:bold; }
    button:hover { background:#388e3c; }
    table { width:100%; border-collapse:collapse; margin-top:20px; }
    th, td { padding:12px; text-align:left; border-bottom:1px solid #444; }
    th { background:#333; }
    ul { list-style:none; padding:0; }
    li { margin:10px 0; padding:10px; background:#333; border-radius:8px; }
    .emoji { font-size:28px; }
  </style>

  <!-- WebAuthn library for fingerprint / passkeys -->
  <script src="https://unpkg.com/@simplewebauthn/browser@9/dist/bundle/index.umd.min.js"></script>
</head>
<body>

<header>OvenX Staff Attendance 🔥</header>

<div class="section" id="loginSection">
  <h2>Employee Login <span class="emoji">👤</span></h2>
  <input type="text" id="empName" placeholder="Enter Your Name">
  <button id="registerBtn">Register Fingerprint</button>
  <button id="loginBtn">Login with Fingerprint</button>
</div>

<div class="section" id="attendanceSection" style="display:none;">
  <h2 id="welcomeMsg">Welcome!</h2>
  <p id="status">Checking status...</p>
  <button id="inBtn">Mark In ⏰</button>
  <button id="outBtn">Mark Out 🏠</button>
  <button id="logoutBtn">Logout</button>
</div>

<div class="section" id="managerSection">
  <h2>Manager Portal <span class="emoji">👑</span></h2>
  <input type="password" id="pinInput" placeholder="Manager PIN">
  <button id="managerLoginBtn">Enter Dashboard</button>
  <div id="managerContent">
    <h3>Pending Approvals</h3>
    <ul id="pendingList"></ul>
    <h3>All Records</h3>
    <table id="recordsTable">
      <thead><tr><th>Name</th><th>Date</th><th>In</th><th>Out</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js@v2';

  const SUPABASE_URL    = 'https://yurcvcopewizauhzpiek.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_cwLnJsHZDELZXEpB6xfwbw_NVqT_s4G';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const MANAGER_PIN     = "7530"; // ← your current PIN
  const RESTAURANT_LAT  = 24.8607;
  const RESTAURANT_LNG  = 67.0011;
  const MAX_DISTANCE    = 0.2; // km

  let currentUser = null;

  // Location check (restaurant WiFi / GPS approx)
  const isAtRestaurant = async () => {
    return new Promise(resolve => {
      navigator.geolocation.getCurrentPosition(pos => {
        const R = 6371;
        const dLat = (RESTAURANT_LAT - pos.coords.latitude) * Math.PI / 180;
        const dLon = (RESTAURANT_LNG - pos.coords.longitude) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(pos.coords.latitude * Math.PI / 180) *
                  Math.cos(RESTAURANT_LAT * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const distance = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        resolve(distance <= MAX_DISTANCE);
      }, () => resolve(false), { enableHighAccuracy: true, timeout: 8000 });
    });
  };

  // Register name → pending table (fingerprint simulation for now)
  document.getElementById('registerBtn').onclick = async () => {
    const name = document.getElementById('empName').value.trim();
    if (!name) return alert("Enter your name!");

    try {
      const { error } = await supabase.from('pending_registrations').insert({ name });
      if (error) throw error;
      alert("Request sent! Manager will approve soon.");
    } catch (err) {
      alert("Registration failed: " + (err.message || "Unknown error"));
      console.error(err);
    }
  };

  // Login
  document.getElementById('loginBtn').onclick = async () => {
    const name = document.getElementById('empName').value.trim();
    if (!name) return alert("Enter your name!");

    try {
      const { data, error } = await supabase.from('users').select().eq('name', name).single();
      if (error || !data) throw new Error("Not approved yet or name not found.");
      currentUser = data;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('attendanceSection').style.display = 'block';
      document.getElementById('welcomeMsg').innerText = `Welcome ${name}! 🙌`;
      updateStatus();
    } catch (err) {
      alert(err.message);
    }
  };

  // Mark In / Out
  const mark = async (type) => {
    if (!currentUser) return alert("Please login first!");
    if (!await isAtRestaurant()) return alert("Only allowed inside restaurant (WiFi/GPS check failed)");

    const today = new Date().toISOString().slice(0,10);
    const time = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});

    try {
      const { data: rec } = await supabase.from('attendance')
        .select().eq('user_id', currentUser.id).eq('date', today).single();

      if (type === 'in' && rec?.in_time) return alert("Already marked In today!");
      if (type === 'out' && !rec?.in_time) return alert("Mark In first!");
      if (type === 'out' && rec?.out_time) return alert("Already marked Out today!");

      const updates = type === 'in' ? { in_time: time } : { out_time: time };

      if (rec) {
        await supabase.from('attendance').update(updates).eq('id', rec.id);
      } else {
        await supabase.from('attendance').insert({ user_id: currentUser.id, date: today, ...updates });
      }

      updateStatus();
      alert(type === 'in' ? "Checked In!" : "Checked Out!");
    } catch (err) {
      alert("Error: " + err.message);
    }
  };

  const updateStatus = async () => {
    const today = new Date().toISOString().slice(0,10);
    const { data } = await supabase.from('attendance')
      .select('in_time, out_time')
      .eq('user_id', currentUser.id)
      .eq('date', today)
      .single();

    document.getElementById('status').innerText = data
      ? `In: ${data.in_time || '-'} | Out: ${data.out_time || 'Working'}`
      : "Not checked in today";
  };

  document.getElementById('inBtn').onclick  = () => mark('in');
  document.getElementById('outBtn').onclick = () => mark('out');
  document.getElementById('logoutBtn').onclick = () => {
    currentUser = null;
    document.getElementById('attendanceSection').style.display = 'none';
    document.getElementById('loginSection').style.display = 'block';
  };

  // Manager login & dashboard
  document.getElementById('managerLoginBtn').onclick = () => {
    if (document.getElementById('pinInput').value !== MANAGER_PIN) {
      return alert("Wrong PIN!");
    }
    document.getElementById('managerContent').style.display = 'block';
    loadPending();
    loadAllRecords();
  };

  const loadPending = async () => {
    try {
      const { data } = await supabase.from('pending_registrations').select();
      const list = document.getElementById('pendingList');
      list.innerHTML = '';
      data.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `${p.name} <button onclick="approve('${p.id}', '${p.name.replace(/'/g,"\\'")}')">Approve</button>`;
        list.appendChild(li);
      });
    } catch (err) {
      alert("Cannot load pending: " + err.message);
    }
  };

  window.approve = async (id, name) => {
    try {
      await supabase.from('users').insert({ name, role: 'employee' });
      await supabase.from('pending_registrations').delete().eq('id', id);
      loadPending();
      alert(`${name} approved!`);
    } catch (err) {
      alert("Approval failed: " + err.message);
    }
  };

  const loadAllRecords = async () => {
    try {
      const { data } = await supabase.from('attendance')
        .select('date, in_time, out_time, users(name)')
        .order('date', { ascending: false });
      const tbody = document.querySelector('#recordsTable tbody');
      tbody.innerHTML = '';
      data.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.users.name}</td><td>${r.date}</td><td>${r.in_time||''}</td><td>${r.out_time||''}</td>`;
        tbody.appendChild(tr);
      });
    } catch (err) {
      alert("Cannot load records: " + err.message);
    }
  };
</script>
</body>
</html>
