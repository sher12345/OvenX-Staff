       const VisualIntelligence = ({ logs, adminData, scope }) => {
    const lineRef = useRef(null);
    const doughRef = useRef(null);
    const charts = useRef({ line: null, dough: null });
    const [chartData, setChartData] = useState({ labels: [], costPoints: [], counts: { Present: 0, Closed: 0, Other: 0 } });
    const lastLogSignatureRef = useRef('');
    const isFirstRunRef = useRef(true);

    // Process data only when logs actually change (not just reference)
    useEffect(() => {
        // Create a signature of current logs state
        const currentSignature = logs.map(l => `${l.id}-${l.check_in}-${l.check_out}`).join('|');
        
        // Only process if data actually changed or first run
        if (isFirstRunRef.current || currentSignature !== lastLogSignatureRef.current) {
            const labels = [...Array(7)].map((_, i) => {
                const d = new Date(); d.setDate(d.getDate() - (6 - i));
                return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            });

            const costPoints = labels.map(label => {
    return logs.filter(l => new Date(l.check_in).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) === label)
               .reduce((sum, log) => {
                   const start = new Date(log.check_in);
                   const end = log.check_out ? new Date(log.check_out) : new Date();
                   const hrs = Math.max(0, (end - start) / 3600000);  // <-- ADD Math.max(0, ...)
                   return sum + (hrs * (log.profiles?.daily_rate / 10 || 0));
               }, 0);
});

            const presentCount = logs.filter(l => !l.check_out).length;
            const closedCount = new Set(logs.filter(l => l.check_out).map(l => l.employee_id)).size;
            const otherCount = adminData.length - presentCount - closedCount;

            setChartData({ 
                labels, 
                costPoints, 
                counts: { 
                    Present: presentCount, 
                    Closed: closedCount, 
                    Other: Math.max(0, otherCount) 
                } 
            });
            
            lastLogSignatureRef.current = currentSignature;
            isFirstRunRef.current = false;
        }
    }, [logs, adminData.length]); // Only depend on logs and adminData length, not the whole object

    // Update charts when chartData changes
    useEffect(() => {
        if (!lineRef.current || !doughRef.current) return;
        
        if (charts.current.line) charts.current.line.destroy();
        if (charts.current.dough) charts.current.dough.destroy();

        charts.current.line = new Chart(lineRef.current, {
            type: 'line',
            data: {
                labels: chartData.labels,
                datasets: [{
                    data: chartData.costPoints,
                    borderColor: '#f37021',
                    backgroundColor: 'rgba(243, 112, 33, 0.05)',

                    tension: 0.4,

        });

        charts.current.dough = new Chart(doughRef.current, {

        });

    }, [chartData]);
    useEffect(() => {
        return () => {
            if (charts.current.line) {
                charts.current.line.destroy();
                charts.current.line = null;
            }
            if (charts.current.dough) {
                charts.current.dough.destroy();
                charts.current.dough = null;
            }
        };
    }, []);

    return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">

            </div>

};

            // --- TIMEZONE-FIXED AUTO-CHECKOUT ---
useEffect(() => {
    const runAutoCheck = async () => {
        const now = new Date(); // Local time
        const liveShifts = logs.filter(l => !l.check_out);
        
        for (const shift of liveShifts) {
            // Skip if this shift was recently manually edited (within last 30 seconds)
            const recentEditTime = recentEdits[shift.id];
            if (recentEditTime && (now - new Date(recentEditTime)) < 30000) {
                console.log(`Skipping auto-checkout for shift ${shift.id} - recent manual edit`);
                continue;
            }
            
            const prof = profiles.find(p => p.id === shift.employee_id);
            if (!prof || !prof.shift_end) continue;
            
            // Convert check_in to LOCAL time (fix timezone issue)
            const checkIn = new Date(shift.check_in);
            const [endH, endM] = prof.shift_end.split(':').map(Number);
            
            // Create autoEnd in LOCAL time on same calendar day as checkIn
            let autoEnd = new Date(checkIn);
            autoEnd.setHours(endH, endM, 0, 0);
            
            // If shift_end is 2 AM, it's always next day
            // If shift_end is before check-in time, it's overnight
            if (endH === 2 || autoEnd.getTime() <= checkIn.getTime()) {
                autoEnd.setDate(autoEnd.getDate() + 1);
            }
            
            // Debug log
            console.log(`${prof.full_name}: CheckIn ${checkIn.toLocaleString()}, AutoEnd ${autoEnd.toLocaleString()}, Now ${now.toLocaleString()}`);
            
            if (now >= autoEnd) {
                await sb.from('attendance')
                    .update({ check_out: autoEnd.toISOString() })
                    .eq('id', shift.id);
                refreshData();
                if(employee && employee.id === prof.id) setEmployee(null);
            }
        }
    };
    
    if (new Date(currentTime).getSeconds() === 0) runAutoCheck();
}, [currentTime, logs, profiles, recentEdits]);

                                                            <div className="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-3xl flex items-center justify-center live-dot"><Icons.activity className="w-6 h-6" /></div>
                                                        </div>
                                                        <div className="bg-[#0F172A] p-8 rounded-[2.5rem] shadow-2xl text-white flex justify-between items-center relative overflow-hidden">
                                                            <div className="relative z-10"><p className="text-[10px] text-slate-500 uppercase mb-1">{dateMode === 'rolling' ? scope : 'Custom'} Period Cost</p><p className="text-3xl font-black tracking-tighter uppercase">Rs. {adminProcessedData.reduce((a,b)=>a+parseFloat(b.salary),0).toLocaleString()}</p></div>
                                                            <Icons.zap className="absolute right-[-10%] bottom-[-10%] w-32 h-32 opacity-5" />
                                                        </div>
                                                        <div className="bg-white p-8 rounded-[2.5rem] border shadow-sm flex justify-between items-center">
                                                            <div><p className="text-[10px] font-black text-slate-400 uppercase mb-1">Members</p><p className="text-5xl font-black text-slate-900">{profiles.length}</p></div>
                                                            <div className="w-14 h-14 bg-slate-50 text-slate-400 rounded-3xl flex items-center justify-center"><Icons.users className="w-6 h-6" /></div>
                                                        </div>
                                                    </div>

                                                    <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden font-black">
                                                        <table className="w-full text-left text-sm uppercase">
                                                            <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b">
                                                                <tr><th className="px-10 py-6">Member</th><th className="px-10 py-6">Status / Uniform</th><th className="px-10 py-6 text-center">Work Days</th><th className="px-10 py-6 text-right">Scope PKR</th></tr>
                                                            </thead>
                                                            <tbody className="divide-y font-bold">
                                                                {adminProcessedData.map((r, i) => (
                                                                    <tr key={i} className="hover:bg-slate-50 transition-all">
                                                                        <td className="px-10 py-7 text-base flex items-center gap-3 uppercase font-black">{r.isActive && <div className="w-2 h-2 bg-emerald-500 rounded-full live-dot"></div>}{r.full_name}</td>
                                                                        <td className="px-10 py-7 uppercase">
                                                                            <div className="flex items-center gap-3">
                                                                                {(r.isActive || r.adminStatus === 'Closed') && (
                                                                                    <button onClick={() => toggleUniform(r.activeShiftId, r.uniform)} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${r.isActive ? 'btn-3d' : 'cursor-default'} ${r.uniform ? 'bg-emerald-500 text-white shadow-sm' : 'bg-slate-200 text-slate-400'}`}>{r.uniform ? 'OK' : 'OFF'}</button>
                                                                                )}
                                                                                <span className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase border ${r.adminStatus === 'Present' ? 'bg-emerald-100 text-emerald-600 border-emerald-200' : 'bg-slate-100 text-slate-400 border-slate-200'}`}>{r.adminStatus}</span>
                                                                            </div>
                                                                        </td>
                                                                        <td className="px-10 py-7 text-center font-black">{(r.totalSecs/36000).toFixed(2)}</td>
                                                                        <td className="px-10 py-7 text-right text-[#f37021] text-2xl font-black tracking-tighter">Rs. {parseFloat(r.salary).toLocaleString()}</td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    )}
                                    {adminTab === 'staff' && (
                                        <div className="animate-fade font-black uppercase">
                                            <div className="flex justify-between items-center mb-12">
                                                <h2 className="text-4xl font-black tracking-tighter text-[#8b0000] uppercase">Staff Management</h2>
                                                <button onClick={()=>setIsStaffModal(true)} className="bg-[#f37021] text-white px-8 py-4 rounded-[2rem] font-black btn-3d shadow-[0_5px_0px_#b34e12] tracking-widest">+ REGISTER STAFF</button>
                                            </div>
                                            <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden text-[11px]">
                                                <table className="w-full text-left uppercase">
                                                    <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase border-b">
                                                        <tr><th className="px-10 py-6">Member</th><th className="px-10 py-6 text-center">PIN ID</th><th className="px-10 py-6 text-center">Shift Schedule</th><th className="px-10 py-6 text-right">Actions</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y font-black">
                                                        {profiles.map(p => (
                                                            <tr key={p.id}>
                                                                <td className="px-10 py-6 text-base text-slate-900 font-black">{p.full_name}</td>
                                                                <td className="px-10 py-6 font-mono text-[#f37021] text-center tracking-[0.4em] font-black">{p.display_id}</td>
                                                                <td className="px-10 py-6 text-center font-mono font-black">{p.shift_start || '--:--'} → {p.shift_end || '--:--'}</td>
                                                                <td className="px-10 py-6 text-right flex justify-end gap-3 font-black">
                                                                    <button onClick={()=>setEditStaff(p)} className="p-4 bg-slate-50 text-slate-600 rounded-2xl btn-3d shadow-sm border"><Icons.edit className="w-5 h-5" /></button>
                                                                    <button onClick={() => handleRegisterFinger(p)} className={`p-4 rounded-2xl btn-3d shadow-sm border ${p.fingerprint_id ? 'bg-emerald-500 text-white shadow-[0_4px_0px_#065f46]' : 'bg-slate-50 text-slate-400'}`}><Icons.fingerprint className="w-5 h-5" /></button>
                                                                    <button onClick={async ()=>{if(confirm(`Delete ${p.full_name}?`)){await sb.from('profiles').delete().eq('id',p.id); refreshData();}}} className="p-4 bg-red-100 text-red-600 rounded-2xl btn-3d shadow-sm border border-red-200 font-black"><Icons.trash2 className="w-5 h-5" /></button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {adminTab === 'logs' && (
                                        <div className="animate-fade uppercase font-black">
                                            <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-12 gap-6">
                                                <h2 className="text-4xl font-black tracking-tighter text-[#8b0000] uppercase leading-none">Archives</h2>
                                                <input placeholder="Search records..." value={search} onChange={(e)=>setSearch(e.target.value)}
                                                    className="pl-6 py-3 bg-white rounded-2xl text-xs font-black outline-none border focus:border-[#f37021] shadow-sm w-full lg:w-64 uppercase" />
                                            </div>
                                            <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden font-black">
                                                <table className="w-full text-left text-sm uppercase">
                                                    <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase border-b">
                                                        <tr><th className="px-8 py-6">Staff</th><th className="px-8 py-6">Timeline</th><th className="px-8 py-6 text-right">Actions</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y text-slate-800">
                                                        {filteredArchives.map((l, i) => (
                                                            <tr key={i} className="hover:bg-slate-50 font-bold uppercase">
                                                                <td className="px-8 py-6 uppercase font-black"><p className="font-black text-slate-900 leading-none">{l.profiles?.full_name}</p></td>
                                                                <td className="px-8 py-6 font-mono text-[11px] font-black">
                                                                    <div className="text-emerald-600">IN: {new Date(l.check_in).toLocaleString()}</div>
                                                                    <div className={l.check_out ? 'text-red-800' : 'text-indigo-600'}>OUT: {l.check_out ? new Date(l.check_out).toLocaleString() : 'LIVE'}</div>
                                                                </td>
                                                                <td className="px-8 py-6 text-right flex justify-end gap-2 uppercase">
                                                                    <button onClick={()=>setEditLog(l)} className="p-3 bg-slate-50 rounded-2xl btn-3d shadow-sm border"><Icons.edit3 className="w-4 h-4" /></button>
                                                                    <button onClick={async ()=>{if(confirm("Delete Record?")){await sb.from('attendance').delete().eq('id',l.id); refreshData();}}} className="p-3 bg-red-100 text-red-600 rounded-2xl btn-3d shadow-sm border border-red-200"><Icons.trash2 className="w-4 h-4" /></button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                </main>
                            </React.Fragment>
                        )}
                    </div>

                    {/* MODALS SECTION */}
                    
                    {isStaffModal && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-[200] flex items-center justify-center p-6 animate-fade uppercase font-black">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-md shadow-2xl">
                                <h3 className="text-3xl font-black mb-8 text-[#8b0000] uppercase">Register Staff</h3>
                                <div className="space-y-6 text-left">
                                    <div className="space-y-1"><label className="text-[9px] ml-4 font-black text-slate-400">LEGAL NAME</label><input placeholder="Staff Full Name" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-black outline-none border-slate-100 focus:border-[#f37021]" value={newStaff.name} onChange={e=>setNewStaff({...newStaff, name:e.target.value})} /></div>
                                    <div className="space-y-1"><label className="text-[9px] ml-4 font-black text-slate-400">PIN ID</label><input placeholder="Numeric ID" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-mono font-black outline-none border-slate-100 focus:border-[#f37021]" value={newStaff.id} onChange={e=>setNewStaff({...newStaff, id:e.target.value})} /></div>
                                    <div className="space-y-1"><label className="text-[9px] ml-4 font-black text-slate-400">PAYOUT RATE (10H)</label><input placeholder="PKR Value" type="number" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-black outline-none border-slate-100 focus:border-[#f37021]" value={newStaff.rate} onChange={e=>setNewStaff({...newStaff, rate:e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1 font-black"><label className="text-[9px] ml-4 text-slate-400 uppercase">Start Time</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={newStaff.shift_start} onChange={e=>setNewStaff({...newStaff, shift_start:e.target.value})} /></div>
                                        <div className="space-y-1 font-black"><label className="text-[9px] ml-4 text-slate-400 uppercase">End Time</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={newStaff.shift_end} onChange={e=>setNewStaff({...newStaff, shift_end:e.target.value})} /></div>
                                    </div>
                                    <div className="flex gap-4 pt-6 font-black"><button onClick={()=>setIsStaffModal(false)} className="flex-1 text-slate-400 uppercase text-xs uppercase tracking-widest">Cancel</button><button onClick={async ()=>{ await sb.from('profiles').insert([{full_name:newStaff.name, display_id:newStaff.id, daily_rate:newStaff.rate, shift_start:newStaff.shift_start, shift_end:newStaff.shift_end}]); refreshData(); setIsStaffModal(false); playSfx('success'); }} className="flex-1 py-6 bg-[#f37021] text-white font-black rounded-[2rem] btn-3d shadow-[0_6px_0_#b34e12] uppercase text-xs tracking-widest">Activate</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editStaff && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-[200] flex items-center justify-center p-6 animate-fade uppercase font-black">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-md shadow-2xl">
                                <h3 className="text-3xl font-black mb-8 text-[#8b0000] uppercase font-black">Update Profile</h3>
                                <div className="space-y-6 text-left font-black">
                                    <div className="space-y-1"><label className="text-[9px] ml-4 text-slate-400">FULL NAME</label><input className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-black outline-none" value={editStaff.full_name} onChange={e=>setEditStaff({...editStaff, full_name:e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1"><label className="text-[9px] ml-4 text-slate-400 uppercase">Shift Start</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={editStaff.shift_start || ''} onChange={e=>setEditStaff({...editStaff, shift_start:e.target.value})} /></div>
                                        <div className="space-y-1"><label className="text-[9px] ml-4 text-slate-400 uppercase">Shift End</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={editStaff.shift_end || ''} onChange={e=>setEditStaff({...editStaff, shift_end:e.target.value})} /></div>
                                    </div>
                                    <div className="flex gap-4 pt-6 font-black"><button onClick={()=>setEditStaff(null)} className="flex-1 text-slate-400 uppercase text-xs">Cancel</button><button onClick={async ()=>{ await sb.from('profiles').update({full_name:editStaff.full_name, shift_start:editStaff.shift_start, shift_end:editStaff.shift_end}).eq('id', editStaff.id); setEditStaff(null); refreshData(); playSfx('success'); }} className="flex-1 py-6 bg-indigo-600 text-white font-black rounded-[2rem] btn-3d shadow-[0_6px_0_#3730a3] uppercase text-xs">Save Changes</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editLog && (
                        <div className="fixed inset-0 bg-[#0F172A]/90 backdrop-blur-xl z-[200] flex items-center justify-center p-6 animate-fade uppercase font-black">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-lg shadow-2xl">
                                <h3 className="text-3xl font-black mb-10 text-[#8b0000] uppercase tracking-tighter">Override Shift</h3>
                                <div className="space-y-10 text-left font-black uppercase">
                                    
                                    {/* Clock-In Input */}
                                    <div className="space-y-2">
                                        <label className="text-[9px] ml-4 text-slate-400 uppercase">Clock-In Timestamp</label>
                                        <input 
                                            type="datetime-local" 
                                            className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" 
                                            value={toLocalISO(editLog.check_in)} 
                                            onChange={e=>setEditLog({...editLog, check_in: new Date(e.target.value).toISOString()})} 
                                        />
                                    </div>
                                    
                                    {/* Clock-Out Input */}
                                    <div className="space-y-2 font-black">
                                        <div className="flex justify-between items-center">
                                            <label className="text-[9px] ml-4 text-slate-400 uppercase">Clock-Out Timestamp</label>
                                            {editLog.check_out && (
                                                <button 
                                                    onClick={() => setEditLog({...editLog, check_out: null})} 
                                                    className="text-[9px] text-red-500 uppercase font-black underline"
                                                >
                                                    Return to Live
                                                </button>
                                            )}
                                        </div>
                                        <input 
                                            type="datetime-local" 
                                            className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" 
                                            value={editLog.check_out ? toLocalISO(editLog.check_out) : ''} 
                                            onChange={e=>setEditLog({...editLog, check_out: e.target.value ? new Date(e.target.value).toISOString() : null})} 
                                        />
                                    </div>
                                    
                                    {/* Buttons Container - Fixed with flex gap */}
                                    <div className="flex gap-6 pt-6 font-black">
                                        <button 
                                            onClick={()=>setEditLog(null)} 
                                            className="flex-1 text-slate-400 uppercase text-xs"
                                        >
                                            Discard
                                        </button>
                                        <button 
                                            onClick={async ()=>{
                                                await sb.from('attendance').update({
                                                    check_in: editLog.check_in, 
                                                    check_out: editLog.check_out
                                                }).eq('id', editLog.id);
                                                
                                                // Mark this shift as recently edited to prevent auto-checkout from overriding it
                                                setRecentEdits(prev => ({...prev, [editLog.id]: new Date().toISOString()}));
                                                
                                                setEditLog(null); 
                                                refreshData(); 
                                                playSfx('success');
                                            }} 
                                            className="flex-1 py-6 bg-indigo-600 text-white font-black rounded-[2.5rem] btn-3d uppercase text-xs shadow-[0_6px_0px_#3730a3]"
                                        >
                                            Update Record
                                        </button>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
