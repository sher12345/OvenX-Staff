    <style>
        :root { 
            --red: #8b0000; 
            --orange: #f37021; 
            --dark-orange: #b34e12; 
            --navy: #0F172A; 
            --bg: #f8fafc; 
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg); 
            color: #333; 
            overflow: hidden; 
            font-style: normal !important;
        }

        /* Global Typography Enforcement */
        * { 
            font-style: normal !important; 
        }

        .btn-3d { 
            transition: transform 0.1s, box-shadow 0.1s; 
            cursor: pointer; 
            border: none; 
            position: relative; 
            user-select: none; 
        }
        
        .btn-3d:active { 
            transform: translateY(4px) !important; 
            box-shadow: 0 2px 0px rgba(0,0,0,0.2) !important; 
        }

        .sidebar-active { 
            background: var(--orange) !important; 
            color: white !important; 
            box-shadow: 0 8px 20px rgba(243, 112, 33, 0.4); 
            border-radius: 15px; 
        }

        .admin-sidebar { 
            background: var(--red); 
            border-right: 6px solid var(--orange); 
        }

        .glass-bubble { 
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(25px); 
            max-height: 90vh; 
            overflow-y: auto; 
            border-radius: 35px; 
            border: 4px solid var(--orange); 
        }

        .kiosk-card { 
            background: white; 
            border-radius: 35px; 
            box-shadow: 0 20px 0px #eee; 
            border: 3px solid #fff; 
        }

        @keyframes pulse-live { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.3; } 
        }
        
        .live-dot { 
            animation: pulse-live 1.5s infinite; 
        }

        .animate-fade { 
            animation: fadeIn 0.3s ease-out forwards; 
        }

        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Custom Scrollbar for Dashboard */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>

        // --- SUB-COMPONENTS ---
        
        const LiveShiftEngine = ({ startTime, dailyRate }) => {
            const [seconds, setSeconds] = useState(0);
            
            useEffect(() => {
                const tick = () => {
                    const diff = Math.max(0, Math.floor((new Date() - new Date(startTime)) / 1000));
                    setSeconds(diff);
                };
                tick(); 
                const i = setInterval(tick, 1000); 
                return () => clearInterval(i);
            }, [startTime]);

            const h = Math.floor(seconds / 3600); 
            const m = Math.floor((seconds % 3600) / 60); 
            const s = seconds % 60;
            const liveMoney = ((seconds / 36000) * dailyRate).toFixed(2);

            return (

       const VisualIntelligence = ({ logs, adminData, scope }) => {
    const lineRef = useRef(null);
    const doughRef = useRef(null);
    const charts = useRef({ line: null, dough: null });
    const [chartData, setChartData] = useState({ labels: [], costPoints: [], counts: { Present: 0, Closed: 0, Other: 0 } });
    const lastLogSignatureRef = useRef('');
    const isFirstRunRef = useRef(true);

    // Process data only when logs actually change (not just reference)
    useEffect(() => {
        // Create a signature of current logs state
        const currentSignature = logs.map(l => `${l.id}-${l.check_in}-${l.check_out}`).join('|');
        
        // Only process if data actually changed or first run
        if (isFirstRunRef.current || currentSignature !== lastLogSignatureRef.current) {
            const labels = [...Array(7)].map((_, i) => {
                const d = new Date(); d.setDate(d.getDate() - (6 - i));
                return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            });

            const costPoints = labels.map(label => {
                return logs.filter(l => new Date(l.check_in).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) === label)
                           .reduce((sum, log) => {
                               const start = new Date(log.check_in);
                               const end = log.check_out ? new Date(log.check_out) : new Date();
                               const hrs = (end - start) / 3600000;
                               return sum + (hrs * (log.profiles?.daily_rate / 10 || 0));
                           }, 0);
            });

            const presentCount = logs.filter(l => !l.check_out).length;
            const closedCount = new Set(logs.filter(l => l.check_out).map(l => l.employee_id)).size;
            const otherCount = adminData.length - presentCount - closedCount;

            setChartData({ 
                labels, 
                costPoints, 
                counts: { 
                    Present: presentCount, 
                    Closed: closedCount, 
                    Other: Math.max(0, otherCount) 
                } 
            });
            
            lastLogSignatureRef.current = currentSignature;
            isFirstRunRef.current = false;
        }
    }, [logs, adminData.length]); // Only depend on logs and adminData length, not the whole object

    // Update charts when chartData changes
    useEffect(() => {
        if (!lineRef.current || !doughRef.current) return;
        
        if (charts.current.line) charts.current.line.destroy();
        if (charts.current.dough) charts.current.dough.destroy();

        charts.current.line = new Chart(lineRef.current, {
            type: 'line',
            data: {
                labels: chartData.labels,
                datasets: [{
                    data: chartData.costPoints,
                    borderColor: '#f37021',
                    backgroundColor: 'rgba(243, 112, 33, 0.05)',
                    fill: true,
                    tension: 0.4,
                    borderWidth: 4,
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                    x: { grid: { display: false } }
                }
            }
        });

        charts.current.dough = new Chart(doughRef.current, {
            type: 'doughnut',
            data: {
                labels: ['On-Duty', 'Shift Closed', 'Others'],
                datasets: [{
                    data: [chartData.counts.Present, chartData.counts.Closed, chartData.counts.Other],
                    backgroundColor: ['#10b981', '#f37021', '#cbd5e1'],
                    borderWidth: 0
                }]
            },
            options: { 
                cutout: '75%', 
                plugins: { 
                    legend: { 
                        position: 'bottom', 
                        labels: { boxWidth: 12, padding: 20, font: { weight: '800' } } 
                    } 
                } 
            }
        });

    }, [chartData]);

    return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
            <div className="bg-white p-8 rounded-[3rem] border shadow-sm h-80 flex flex-col">
                <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-6 uppercase">Expenditure Trend (Last 7 Days)</p>
                <div className="flex-1"><canvas ref={lineRef}></canvas></div>
            </div>
            <div className="bg-white p-8 rounded-[3rem] border shadow-sm flex flex-col items-center h-80">
                <p className="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 self-start uppercase">Staffing Status Breakdown</p>
                <div className="w-full h-full max-h-[220px] flex justify-center"><canvas ref={doughRef}></canvas></div>
            </div>
        </div>
    );
};

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [view, setView] = useState('kiosk');
            const [adminTab, setAdminTab] = useState('overview');
            const [scope, setScope] = useState('day');
            const [dateMode, setDateMode] = useState('rolling');
const [startDate, setStartDate] = useState(new Date().toISOString().split('T')[0]);
const [endDate, setEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [pin, setPin] = useState('');
            const [employee, setEmployee] = useState(null);
            const [search, setSearch] = useState('');
            
            const [profiles, setProfiles] = useState([]);
            const [logs, setLogs] = useState([]);
            const [currentTime, setCurrentTime] = useState(Date.now());
            
            // Modal States
            const [editLog, setEditLog] = useState(null);
            const [editStaff, setEditStaff] = useState(null);
            const [isStaffModal, setIsStaffModal] = useState(false);
            const [newStaff, setNewStaff] = useState({ name: '', id: '', rate: '', shift_start: '', shift_end: '' });

            // Real-time clock (1 second interval for smooth UI)
useEffect(() => {
  const timer = setInterval(() => {
    setCurrentTime(Date.now());
  }, 1000);
  return () => clearInterval(timer);
}, []);

// Dashboard Engine Loop
useEffect(() => { 
  refreshData();
  const timer = setInterval(() => {
    if (view === 'admin' && adminTab === 'overview') refreshData();
  }, 3000);
  return () => clearInterval(timer);
}, [view, adminTab]);

            // --- AUTO-CHECKOUT ENGINE ---
            useEffect(() => {
                const runAutoCheck = async () => {
                    const now = new Date();
                    const liveShifts = logs.filter(l => !l.check_out);
                    
                    for (const shift of liveShifts) {
                        const prof = profiles.find(p => p.id === shift.employee_id);
                        if (!prof || !prof.shift_end) continue;
                        
                        const [endH, endM] = prof.shift_end.split(':').map(Number);
                        const checkInDate = new Date(shift.check_in);
                        let autoEnd = new Date(checkInDate);
                        autoEnd.setHours(endH, endM, 0, 0);
                        
                        if (autoEnd <= checkInDate) autoEnd.setDate(autoEnd.getDate() + 1);
                        
                        if (now >= autoEnd) {
                            await sb.from('attendance').update({ check_out: autoEnd.toISOString() }).eq('id', shift.id);
                            refreshData();
                            if(employee && employee.id === prof.id) setEmployee(null);
                        }
                    }
                };
                if (new Date(currentTime).getSeconds() === 0) runAutoCheck();
            }, [currentTime, logs, profiles]);

            const refreshData = async () => {
                const { data: p } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
                const { data: l } = await sb.from('attendance').select('*, profiles(*)').order('check_in', { ascending: false });
                setProfiles(p || []); setLogs(l || []);
            };

            // --- AUTH LOGIC ---
            const handleFingerprintLogin = async () => {
                try {
                    playSfx('pop');
                    const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
                    const assertion = await navigator.credentials.get({ publicKey: { challenge, userVerification: "required" } });
                    if (!assertion) return;
                    const credIdB64 = bufferToBase64(assertion.rawId);
                    const { data: user } = await sb.from('profiles').select('*').eq('fingerprint_id', credIdB64).single();
                    if (user) {
                        const { data: session } = await sb.from('attendance').select('*').eq('employee_id', user.id).is('check_out', null).single();
                        setEmployee({ ...user, currentShift: session });
                        playSfx('success');
                    } else { alert("Fingerprint not recognized."); playSfx('error'); }
                } catch (err) { console.error(err); }
            };

            const handleRegisterFinger = async (user) => {
  try {
    playSfx('pop');
    const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
    const createOptions = {
      publicKey: {
        challenge,
        rp: { name: "OvenX System" },
        user: { id: strToBuffer(user.id), name: user.display_id, displayName: user.full_name },
        pubKeyCredParams: [{ alg: -7, type: "public-key" }, { alg: -257, type: "public-key" }],
        authenticatorSelection: { authenticatorAttachment: "platform", residentKey: "required", userVerification: "required" },
        timeout: 60000
      }
    };
    const credential = await navigator.credentials.create(createOptions);
    const credIdB64 = bufferToBase64(credential.rawId);
    await sb.from('profiles').update({ fingerprint_id: credIdB64 }).eq('id', user.id);
    alert("Success! Fingerprint linked to " + user.full_name);
    playSfx('success');
    refreshData(); // ← ADD THIS LINE
  } catch (err) { alert("Failed: " + err.message); }
};
            const handleLogin = async () => {
                playSfx('pop');
                const { data: user } = await sb.from('profiles').select('*').eq('display_id', pin).single();
                if (user) {
                    const { data: session } = await sb.from('attendance').select('*').eq('employee_id', user.id).is('check_out', null).single();
                    setEmployee({ ...user, currentShift: session });
                    setPin(''); playSfx('success');
                } else { playSfx('error'); setPin(''); }
            };

            const handleAdminAccess = () => {
                playSfx('pop');
                if (view === 'admin') return setView('kiosk');
                const pass = prompt("Admin Password Required:");
                if (pass === "75300") { setView('admin'); playSfx('success'); }
                else if(pass !== null) { alert("Invalid Credentials"); playSfx('error'); }
            };

            const toggleUniform = async (shiftId, currentStatus) => {
                playSfx('pop');
                await sb.from('attendance').update({ uniform: !currentStatus }).eq('id', shiftId);
                refreshData();
            };

            const toggleShift = async (type) => {
                playSfx('pop');
                if (type === 'in') {
                    const { data } = await sb.from('attendance').insert([{ employee_id: employee.id, uniform: true }]).select().single();
                    setEmployee(prev => ({ ...prev, currentShift: data }));
                } else {
                    await sb.from('attendance').update({ check_out: new Date().toISOString() }).eq('id', employee.currentShift.id);
                    setEmployee(null);
                }
                refreshData();
            };

            // --- DATA ENGINES ---
            const adminProcessedData = useMemo(() => {
    let startPoint, endPoint;
    const now = new Date(currentTime);
    
    if (dateMode === 'custom' && startDate && endDate) {
        // Custom date range: Start of start date to end of end date
        startPoint = new Date(startDate);
        startPoint.setHours(0, 0, 0, 0);
        endPoint = new Date(endDate);
        endPoint.setHours(23, 59, 59, 999);
    } else {
        // Rolling mode (existing logic)
        const curH = now.getHours();
        startPoint = new Date(now);
        
        if (scope === 'day') {
            if (curH < 10) startPoint.setDate(now.getDate() - 1);
            startPoint.setHours(10, 0, 0, 0);
            endPoint = new Date(startPoint);
            endPoint.setDate(endPoint.getDate() + 1);
        } else if (scope === 'week') {
            startPoint.setDate(now.getDate() - 7);
            startPoint.setHours(0, 0, 0, 0);
            endPoint = now;
        } else if (scope === 'month') {
            startPoint = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0, 0);
            endPoint = now;
        }
    }

    return profiles.map(profile => {
        const activeShift = logs.find(l => l.employee_id === profile.id && !l.check_out);
        
        // Filter logs within the selected date range
        const scopeLogs = logs.filter(l => {
            const checkIn = new Date(l.check_in);
            return l.employee_id === profile.id && checkIn >= startPoint && checkIn <= endPoint;
        });
        
        let scopeSecs = 0;
        scopeLogs.forEach(l => {
            const start = new Date(l.check_in).getTime();
            const end = l.check_out ? new Date(l.check_out).getTime() : currentTime;
            // Cap end time at the range end if currently working
            const cappedEnd = end > endPoint.getTime() ? endPoint.getTime() : end;
            scopeSecs += Math.max(0, Math.floor((cappedEnd - start) / 1000));
        });

        const salary = ((scopeSecs / 36000) * profile.daily_rate).toFixed(2);
        const lastShift = scopeLogs[0];

        let status = "Offline";
        if (activeShift && new Date(activeShift.check_in) >= startPoint && new Date(activeShift.check_in) <= endPoint) {
            status = "Present";
        } else if (scopeLogs.length > 0) {
            status = "Closed";
        } else if (dateMode === 'custom') {
            status = "No Data";
        } else if (scope === 'day' && (new Date().getHours() >= 10 || new Date().getHours() < 2)) {
            status = "Pending";
        } else {
            status = "Holiday";
        }

        return { 
            ...profile, 
            totalSecs: scopeSecs, 
            salary, 
            isActive: !!(activeShift && new Date(activeShift.check_in) >= startPoint && new Date(activeShift.check_in) <= endPoint), 
            activeShiftId: activeShift?.id || lastShift?.id,

            rangeLabel = 'Week_View';
        } else {

            endPoint = now;
            rangeLabel = 'Month_View';
        }

        return checkIn >= startPoint && checkIn <= endPoint;

    let worksheets = [];

    let summaryRows = profiles.map(profile => {

        let totalSalary = 0;
        let shiftsCount = staffLogs.length;
        
        staffLogs.forEach(l => {
            const start = new Date(l.check_in).getTime();
            const end = l.check_out ? new Date(l.check_out).getTime() : currentTime;
            const secs = Math.max(0, Math.floor((end - start) / 1000));
            totalSecs += secs;
            totalSalary += (secs / 36000) * profile.daily_rate;
        });
        
        const isActive = staffLogs.some(l => !l.check_out);
        const lastLog = staffLogs[0];
        
        let status = "Offline";
        if (isActive) status = "Present";
        else if (shiftsCount > 0) status = "Closed";
        else if (dateMode === 'custom') status = "No Data";
        else if (scope === 'day' && (now.getHours() >= 10 || now.getHours() < 2)) status = "Pending";
        else status = "Holiday";
        
        return {
            name: profile.full_name,
            id: profile.display_id,
            status: status,
            shifts: shiftsCount,
            hours: (totalSecs / 3600).toFixed(2),
            salary: totalSalary.toFixed(2),
            isActive: isActive
        };
    });

    // Generate Summary HTML Table
    let summaryHtml = generateSummaryTable(summaryRows, rangeLabel, startPoint, endPoint);
    worksheets.push({ name: 'Summary', html: summaryHtml });

    // 2. DAILY WORKSHEETS (Only for custom date ranges with multiple days)
    if (dateMode === 'custom') {
        const dayCount = Math.ceil((endPoint - startPoint) / (1000 * 60 * 60 * 24)) + 1;
        
        if (dayCount <= 31) { // Only create daily tabs for reasonable ranges
            for (let d = 0; d < dayCount; d++) {

                dayStart.setDate(dayStart.getDate() + d);
                dayStart.setHours(0, 0, 0, 0);

                });
                
                if (dayLogs.length > 0) {

                    const dayHtml = generateDailyTable(dayLogs, dayName, dayStart, profiles);
                    worksheets.push({ name: dayName, html: dayHtml });
                }

                td { border: 1px solid #ccc; padding: 10px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; }
                .text-left { text-align: left; }
                .text-center { text-align: center; }
                .text-right { text-align: right; }
                .header { font-size: 18px; font-weight: bold; text-align: center; color: #8b0000; margin-bottom: 10px; }
                .subheader { font-size: 12px; text-align: center; color: #666; margin-bottom: 20px; }
                .money { font-weight: bold; color: #f37021; }
                .present { background-color: #dcfce7; }
                .closed { background-color: #e0f2fe; }
                .pending { background-color: #fef9c3; }
                .holiday { background-color: #fee2e2; }
                .offline { background-color: #f3f4f6; }
            </style>
        </head>
        <body>
            ${worksheets.map((ws, idx) => `
                <h2 style="color:#8b0000; font-size:20px; margin-top:30px;">${ws.name}</h2>
                ${ws.html}
                ${idx < worksheets.length - 1 ? '<div style="page-break-after:always;"></div>' : ''}
            `).join('')}
        </body>
        </html>
    `;

    const blob = new Blob([finalHtml], { type: 'application/vnd.ms-excel' });
    const a = document.createElement('a'); 
    a.href = URL.createObjectURL(blob); 
    a.download = `OvenX_${rangeLabel}_${today}.xls`; 
    a.click();

// Helper function for Summary table
const generateSummaryTable = (rows, rangeLabel, start, end) => {
    let totalMoney = rows.reduce((a, b) => a + parseFloat(b.salary), 0);
    let totalHours = rows.reduce((a, b) => a + parseFloat(b.hours), 0);
    
    return `
        <div class="header">OvenX Intelligence - ${rangeLabel} Summary</div>
        <div class="subheader">Period: ${start.toLocaleDateString()} → ${end.toLocaleDateString()}</div>
        <table>
            <thead>
                <tr>
                    <th>Employee Name</th>
                    <th>Staff ID</th>
                    <th>Status</th>
                    <th>Total Shifts</th>
                    <th>Total Hours</th>
                    <th>Total Earnings (PKR)</th>
                </tr>
            </thead>
            <tbody>
                ${rows.map(r => {
                    let rowClass = r.status === 'Present' ? 'present' : 
                                  r.status === 'Closed' ? 'closed' : 
                                  r.status === 'Pending' ? 'pending' : 
                                  r.status === 'Holiday' ? 'holiday' : 'offline';
                    return `
                        <tr class="${rowClass}">
                            <td class="text-left font-bold">${r.name}</td>
                            <td class="text-center font-mono">${r.id}</td>
                            <td class="text-center font-bold">${r.status}</td>
                            <td class="text-center">${r.shifts}</td>
                            <td class="text-center">${r.hours}h</td>
                            <td class="text-right money">Rs. ${parseFloat(r.salary).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
            <tfoot>
                <tr style="background-color: #8b0000; color: white; font-weight: bold;">
                    <td colspan="4" class="text-right">TOTALS:</td>
                    <td class="text-center">${totalHours.toFixed(2)}h</td>
                    <td class="text-right">Rs. ${totalMoney.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                </tr>
            </tfoot>
        </table>
    `;
};

// Helper function for Daily detailed table
const generateDailyTable = (dayLogs, dayName, dayDate, profiles) => {
    return `
        <div class="header">Daily Detail - ${dayName}</div>
        <div class="subheader">${dayDate.toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</div>
        <table>

                <tr>
                    <th>Employee</th>
                    <th>Check-In</th>
                    <th>Check-Out</th>
                    <th>Duration</th>
                    <th>Uniform</th>
                    <th>Earnings (PKR)</th>
                </tr>
            </thead>
            <tbody>
                ${dayLogs.map(log => {
                    const profile = profiles.find(p => p.id === log.employee_id);
                    const start = new Date(log.check_in);
                    const end = log.check_out ? new Date(log.check_out) : null;
                    const duration = end ? ((end - start) / 3600000).toFixed(2) : 'LIVE';
                    const earnings = end ? (((end - start) / 36000000) * (profile?.daily_rate || 0)).toFixed(2) : '0.00';
                    
                    return `

                            <td class="text-right money">Rs. ${parseFloat(earnings).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                        </tr>
                    `;
                }).join('')}
            </tbody>
        </table>
    `;
};

        <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden font-black">
            <table className="w-full text-left text-sm uppercase">
                <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b">
                    <tr><th className="px-10 py-6">Member</th><th className="px-10 py-6">Status / Uniform</th><th className="px-10 py-6 text-center">Work Days</th><th className="px-10 py-6 text-right">Scope PKR</th></tr>
                </thead>
                <tbody className="divide-y font-bold">
                    {adminProcessedData.map((r, i) => (
                        <tr key={i} className="hover:bg-slate-50 transition-all">
                            <td className="px-10 py-7 text-base flex items-center gap-3 uppercase font-black">{r.isActive && <div className="w-2 h-2 bg-emerald-500 rounded-full live-dot"></div>}{r.full_name}</td>
                            <td className="px-10 py-7 uppercase">
                                <div className="flex items-center gap-3">
                                    {(r.isActive || r.adminStatus === 'Closed') && (
                                        <button onClick={() => toggleUniform(r.activeShiftId, r.uniform)} className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${r.isActive ? 'btn-3d' : 'cursor-default'} ${r.uniform ? 'bg-emerald-500 text-white shadow-sm' : 'bg-slate-200 text-slate-400'}`}>{r.uniform ? 'OK' : 'OFF'}</button>
                                    )}
                                    <span className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase border ${r.adminStatus === 'Present' ? 'bg-emerald-100 text-emerald-600 border-emerald-200' : 'bg-slate-100 text-slate-400 border-slate-200'}`}>{r.adminStatus}</span>
                                </div>
                            </td>
                            <td className="px-10 py-7 text-center font-black">{(r.totalSecs/36000).toFixed(2)}</td>
                            <td className="px-10 py-7 text-right text-[#f37021] text-2xl font-black tracking-tighter">Rs. {parseFloat(r.salary).toLocaleString()}</td>
                        </tr>
                    ))}
                </tbody>
            </table>
        </div>
    </div>
)}
                                    {adminTab === 'staff' && (
                                        <div className="animate-fade font-black uppercase">
                                            <div className="flex justify-between items-center mb-12">
                                                <h2 className="text-4xl font-black tracking-tighter text-[#8b0000] uppercase">Staff Management</h2>
                                                <button onClick={()=>setIsStaffModal(true)} className="bg-[#f37021] text-white px-8 py-4 rounded-[2rem] font-black btn-3d shadow-[0_5px_0px_#b34e12] tracking-widest">+ REGISTER STAFF</button>
                                            </div>
                                            <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden text-[11px]">
                                                <table className="w-full text-left uppercase">
                                                    <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase border-b">
                                                        <tr><th className="px-10 py-6">Member</th><th className="px-10 py-6 text-center">PIN ID</th><th className="px-10 py-6 text-center">Shift Schedule</th><th className="px-10 py-6 text-right">Actions</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y font-black">
                                                        {profiles.map(p => (
                                                            <tr key={p.id}>
                                                                <td className="px-10 py-6 text-base text-slate-900 font-black">{p.full_name}</td>
                                                                <td className="px-10 py-6 font-mono text-[#f37021] text-center tracking-[0.4em] font-black">{p.display_id}</td>
                                                                <td className="px-10 py-6 text-center font-mono font-black">{p.shift_start || '--:--'} → {p.shift_end || '--:--'}</td>
                                                                <td className="px-10 py-6 text-right flex justify-end gap-3 font-black">
                                                                    <button onClick={()=>setEditStaff(p)} className="p-4 bg-slate-50 text-slate-600 rounded-2xl btn-3d shadow-sm border"><Icons.edit className="w-5 h-5" /></button>
                                                                    <button onClick={() => handleRegisterFinger(p)} className={`p-4 rounded-2xl btn-3d shadow-sm border ${p.fingerprint_id ? 'bg-emerald-500 text-white shadow-[0_4px_0px_#065f46]' : 'bg-slate-50 text-slate-400'}`}><Icons.fingerprint className="w-5 h-5" /></button>
                                                                    <button onClick={async ()=>{if(confirm(`Delete ${p.full_name}?`)){await sb.from('profiles').delete().eq('id',p.id); refreshData();}}} className="p-4 bg-red-100 text-red-600 rounded-2xl btn-3d shadow-sm border border-red-200 font-black"><Icons.trash2 className="w-5 h-5" /></button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    {adminTab === 'logs' && (
                                        <div className="animate-fade uppercase font-black">
                                            <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-12 gap-6">
                                                <h2 className="text-4xl font-black tracking-tighter text-[#8b0000] uppercase leading-none">Archives</h2>
                                                <input placeholder="Search records..." value={search} onChange={(e)=>setSearch(e.target.value)}
                                                    className="pl-6 py-3 bg-white rounded-2xl text-xs font-black outline-none border focus:border-[#f37021] shadow-sm w-full lg:w-64 uppercase" />
                                            </div>
                                            <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden font-black">
                                                <table className="w-full text-left text-sm uppercase">
                                                    <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase border-b">
                                                        <tr><th className="px-8 py-6">Staff</th><th className="px-8 py-6">Timeline</th><th className="px-8 py-6 text-right">Actions</th></tr>
                                                    </thead>
                                                    <tbody className="divide-y text-slate-800">
                                                        {filteredArchives.map((l, i) => (
                                                            <tr key={i} className="hover:bg-slate-50 font-bold uppercase">
                                                                <td className="px-8 py-6 uppercase font-black"><p className="font-black text-slate-900 leading-none">{l.profiles?.full_name}</p></td>
                                                                <td className="px-8 py-6 font-mono text-[11px] font-black">
                                                                    <div className="text-emerald-600">IN: {new Date(l.check_in).toLocaleString()}</div>
                                                                    <div className={l.check_out ? 'text-red-800' : 'text-indigo-600'}>OUT: {l.check_out ? new Date(l.check_out).toLocaleString() : 'LIVE'}</div>
                                                                </td>
                                                                <td className="px-8 py-6 text-right flex justify-end gap-2 uppercase">
                                                                    <button onClick={()=>setEditLog(l)} className="p-3 bg-slate-50 rounded-2xl btn-3d shadow-sm border"><Icons.edit3 className="w-4 h-4" /></button>
                                                                    <button onClick={async ()=>{if(confirm("Delete Record?")){await sb.from('attendance').delete().eq('id',l.id); refreshData();}}} className="p-3 bg-red-100 text-red-600 rounded-2xl btn-3d shadow-sm border border-red-200"><Icons.trash2 className="w-4 h-4" /></button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}
                                </main>
                            </React.Fragment>
                        )}
                    </div>

                    {/* MODALS SECTION */}
                    
                    {isStaffModal && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-[200] flex items-center justify-center p-6 animate-fade uppercase font-black">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-md shadow-2xl">
                                <h3 className="text-3xl font-black mb-8 text-[#8b0000] uppercase">Register Staff</h3>
                                <div className="space-y-6 text-left">
                                    <div className="space-y-1"><label className="text-[9px] ml-4 font-black text-slate-400">LEGAL NAME</label><input placeholder="Staff Full Name" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-black outline-none border-slate-100 focus:border-[#f37021]" value={newStaff.name} onChange={e=>setNewStaff({...newStaff, name:e.target.value})} /></div>
                                    <div className="space-y-1"><label className="text-[9px] ml-4 font-black text-slate-400">PIN ID</label><input placeholder="Numeric ID" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-mono font-black outline-none border-slate-100 focus:border-[#f37021]" value={newStaff.id} onChange={e=>setNewStaff({...newStaff, id:e.target.value})} /></div>
                                    <div className="space-y-1"><label className="text-[9px] ml-4 font-black text-slate-400">PAYOUT RATE (10H)</label><input placeholder="PKR Value" type="number" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-black outline-none border-slate-100 focus:border-[#f37021]" value={newStaff.rate} onChange={e=>setNewStaff({...newStaff, rate:e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1 font-black"><label className="text-[9px] ml-4 text-slate-400 uppercase">Start Time</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={newStaff.shift_start} onChange={e=>setNewStaff({...newStaff, shift_start:e.target.value})} /></div>
                                        <div className="space-y-1 font-black"><label className="text-[9px] ml-4 text-slate-400 uppercase">End Time</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={newStaff.shift_end} onChange={e=>setNewStaff({...newStaff, shift_end:e.target.value})} /></div>
                                    </div>
                                    <div className="flex gap-4 pt-6 font-black"><button onClick={()=>setIsStaffModal(false)} className="flex-1 text-slate-400 uppercase text-xs uppercase tracking-widest">Cancel</button><button onClick={async ()=>{ await sb.from('profiles').insert([{full_name:newStaff.name, display_id:newStaff.id, daily_rate:newStaff.rate, shift_start:newStaff.shift_start, shift_end:newStaff.shift_end}]); refreshData(); setIsStaffModal(false); playSfx('success'); }} className="flex-1 py-6 bg-[#f37021] text-white font-black rounded-[2rem] btn-3d shadow-[0_6px_0_#b34e12] uppercase text-xs tracking-widest">Activate</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editStaff && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-[200] flex items-center justify-center p-6 animate-fade uppercase font-black">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-md shadow-2xl">
                                <h3 className="text-3xl font-black mb-8 text-[#8b0000] uppercase font-black">Update Profile</h3>
                                <div className="space-y-6 text-left font-black">
                                    <div className="space-y-1"><label className="text-[9px] ml-4 text-slate-400">FULL NAME</label><input className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-black outline-none" value={editStaff.full_name} onChange={e=>setEditStaff({...editStaff, full_name:e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1"><label className="text-[9px] ml-4 text-slate-400 uppercase">Shift Start</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={editStaff.shift_start || ''} onChange={e=>setEditStaff({...editStaff, shift_start:e.target.value})} /></div>
                                        <div className="space-y-1"><label className="text-[9px] ml-4 text-slate-400 uppercase">Shift End</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={editStaff.shift_end || ''} onChange={e=>setEditStaff({...editStaff, shift_end:e.target.value})} /></div>
                                    </div>
                                    <div className="flex gap-4 pt-6 font-black"><button onClick={()=>setEditStaff(null)} className="flex-1 text-slate-400 uppercase text-xs">Cancel</button><button onClick={async ()=>{ await sb.from('profiles').update({full_name:editStaff.full_name, shift_start:editStaff.shift_start, shift_end:editStaff.shift_end}).eq('id', editStaff.id); setEditStaff(null); refreshData(); playSfx('success'); }} className="flex-1 py-6 bg-indigo-600 text-white font-black rounded-[2rem] btn-3d shadow-[0_6px_0_#3730a3] uppercase text-xs">Save Changes</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editLog && (
                        <div className="fixed inset-0 bg-[#0F172A]/90 backdrop-blur-xl z-[200] flex items-center justify-center p-6 animate-fade uppercase font-black">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-lg shadow-2xl">
                                <h3 className="text-3xl font-black mb-10 text-[#8b0000] uppercase tracking-tighter">Override Shift</h3>
                                <div className="space-y-10 text-left font-black uppercase">
                                    <div className="space-y-2"><label className="text-[9px] ml-4 text-slate-400 uppercase">Clock-In Timestamp</label><input type="datetime-local" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={toLocalISO(editLog.check_in)} onChange={e=>setEditLog({...editLog, check_in: new Date(e.target.value).toISOString()})} /></div>
                                    <div className="space-y-2 font-black"><div className="flex justify-between items-center"><label className="text-[9px] ml-4 text-slate-400 uppercase">Clock-Out Timestamp</label>{editLog.check_out && <button onClick={() => setEditLog({...editLog, check_out: null})} className="text-[9px] text-red-500 uppercase font-black underline">Return to Live</button>}</div><input type="datetime-local" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none font-black" value={editLog.check_out ? toLocalISO(editLog.check_out) : ''} onChange={e=>setEditLog({...editLog, check_out: e.target.value ? new Date(e.target.value).toISOString() : null})} /></div>
                                    <div className="flex gap-6 pt-6 font-black"><button onClick={()=>setEditLog(null)} className="flex-1 text-slate-400 uppercase text-xs">Discard</button><button onClick={async ()=>{await sb.from('attendance').update({check_in: editLog.check_in, check_out: editLog.check_out}).eq('id', editLog.id); setEditLog(null); refreshData(); playSfx('success');}} className="flex-1 py-6 bg-indigo-600 text-white font-black rounded-[2.5rem] btn-3d uppercase text-xs shadow-[0_6px_0px_#3730a3]">Update Record</button></div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
