                                            <div className="bg-[#0F172A] p-8 rounded-[2.5rem] shadow-2xl text-white flex justify-between items-center relative overflow-hidden">
                                                <div className="relative z-10"><p className="text-[10px] text-slate-500 uppercase tracking-widest mb-1">Live Monthly Cost</p><p className="text-3xl font-black italic tracking-tighter">Rs. {adminProcessedData.reduce((a,b)=>a+parseFloat(b.salary),0).toLocaleString()}</p></div>
                                                <i data-lucide="zap" className="absolute right-[-10%] bottom-[-10%] w-32 h-32 opacity-5"></i>
                                            </div>
                                            <div className="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 flex justify-between items-center">
                                                <div><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 leading-none">Registered Members</p><p className="text-5xl font-black text-slate-900 italic">{profiles.length}</p></div>
                                                <div className="w-14 h-14 bg-slate-50 text-slate-400 rounded-3xl flex items-center justify-center"><i data-lucide="users"></i></div>
                                            </div>
                                        </div>
                                        <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden">
                                            <table className="w-full text-left font-bold text-sm italic">
                                                <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest border-b">
                                                    <tr><th className="px-10 py-6">Member</th><th className="px-10 py-6">Status / Uniform</th><th className="px-10 py-6">Shift Time (Today)</th><th className="px-10 py-6 text-center">Days</th><th className="px-10 py-6 text-right">Today's PKR</th></tr>
                                                </thead>
                                                <tbody className="divide-y">
                                                    {adminProcessedData.map((r, i) => (
                                                        <tr key={i} className="hover:bg-slate-50 transition-all">
                                                            <td className="px-10 py-7 text-base flex items-center gap-3">{r.isActive && <div className="w-2 h-2 bg-emerald-500 rounded-full live-dot"></div>}{r.full_name}</td>
                                                            <td className="px-10 py-7">
                                                                <div className="flex items-center gap-3">
                                                                    {(r.isActive || r.adminStatus === 'Closed') && (
                                                                        <button onClick={() => { if(r.isActive) toggleUniform(r.activeShiftId, r.uniform) }}
                                                                            className={`px-4 py-2 rounded-xl text-[9px] font-black uppercase transition-all ${r.isActive ? 'btn-3d shadow-[0_4px_0px_rgba(0,0,0,0.1)]' : 'cursor-default'} ${r.uniform ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-400'}`}>
                                                                            {r.uniform ? 'Uniform OK' : 'Uniform OFF'}
                                                                        </button>
                                                                    )}
                                                                    {r.adminStatus === 'Present' ? (
                                                                        <span className="bg-emerald-100 text-emerald-600 px-4 py-2 rounded-xl text-[9px] font-black uppercase border border-emerald-200">PRESENT</span>
                                                                    ) : r.adminStatus === 'Closed' ? (
                                                                        <span className="bg-emerald-500 text-white px-4 py-2 rounded-xl text-[9px] font-black uppercase border border-emerald-600 shadow-sm">Shift Closed</span>
                                                                    ) : r.adminStatus === 'Pending' ? (
                                                                        <span className="bg-indigo-50 text-indigo-400 px-4 py-2 rounded-xl text-[9px] font-black uppercase border border-indigo-100 italic">Pending...</span>
                                                                    ) : r.adminStatus === 'Holiday' ? (
                                                                        <span className="bg-rose-100 text-rose-600 px-4 py-2 rounded-xl text-[9px] font-black uppercase border border-rose-200">ABSENT / HOLIDAY</span>
                                                                    ) : (
                                                                        <span className="text-slate-300 text-[9px] uppercase px-4 italic opacity-40">Offline</span>
                                                                    )}
                                                                </div>
                                                            </td>
                                                            <td className="px-10 py-7 font-mono text-indigo-600 tracking-tighter">
                                                                {r.adminStatus === 'Holiday' ? '--' : `${Math.floor(r.totalSecs/3600)}h ${Math.floor((r.totalSecs%3600)/60)}m`}
                                                            </td>
                                                            <td className="px-10 py-7 text-center font-black"><span className="bg-slate-100 px-5 py-2 rounded-xl text-slate-600">{(r.totalSecs/36000).toFixed(2)}</span></td>
                                                            <td className="px-10 py-7 text-right font-black text-[#f37021] text-2xl tracking-tighter">Rs. {parseFloat(r.salary).toLocaleString()}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'logs' && (
                                    <div className="animate-fade">
                                        <div className="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-12 gap-6">
                                            <h2 className="text-4xl font-black tracking-tighter italic text-[#8b0000] uppercase">Archives</h2>
                                            <input placeholder="Search records..." value={search} onChange={(e)=>setSearch(e.target.value)}
                                                className="pl-6 py-3 bg-white rounded-2xl text-xs font-bold outline-none border focus:border-[#f37021] shadow-sm w-full lg:w-64" />
                                        </div>
                                        <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden font-bold italic">
                                            <table className="w-full text-left text-sm">
                                                <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase border-b">
                                                    <tr><th className="px-8 py-6">Staff</th><th className="px-8 py-6">Timeline</th><th className="px-8 py-6">Earnings</th><th className="px-8 py-6 text-right">Actions</th></tr>
                                                </thead>
                                                <tbody className="divide-y text-slate-800">
                                                    {filteredArchives.map((l, i) => (
                                                        <tr key={i} className="hover:bg-slate-50">
                                                            <td className="px-8 py-6"><p className="font-black text-slate-900 leading-none">{l.profiles?.full_name}</p></td>
                                                            <td className="px-8 py-6 font-mono text-[11px]">
                                                                <div className="text-emerald-600">IN: {new Date(l.check_in).toLocaleString()}</div>
                                                                <div className={l.check_out ? 'text-red-800' : 'text-indigo-600 font-black'}>OUT: {l.check_out ? new Date(l.check_out).toLocaleString() : 'LIVE'}</div>
                                                            </td>
                                                            <td className="px-8 py-6 text-indigo-600 text-lg font-black">Rs. {l.earned}</td>
                                                            <td className="px-8 py-6 text-right flex justify-end gap-2">
                                                                <button onClick={()=>setEditLog(l)} className="p-3 bg-slate-50 rounded-2xl btn-3d shadow-sm border"><i data-lucide="edit-3" className="w-4 h-4"></i></button>
                                                                <button onClick={async ()=>{if(confirm("Delete Record?")){await sb.from('attendance').delete().eq('id',l.id); refreshData();}}} className="p-3 bg-red-100 text-red-600 rounded-2xl btn-3d shadow-sm border border-red-200"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {adminTab === 'staff' && (
                                    <div className="animate-fade">
                                        <div className="flex justify-between items-center mb-12">
                                            <h2 className="text-4xl font-black tracking-tighter italic uppercase text-[#8b0000]">Human Resources</h2>
                                            <button onClick={()=>setIsStaffModal(true)} className="bg-[#f37021] text-white px-8 py-4 rounded-[2rem] font-black text-sm btn-3d shadow-[0_5px_0px_#b34e12]">+ REGISTER</button>
                                        </div>
                                        <div className="bg-white rounded-[3rem] border shadow-2xl overflow-hidden font-bold italic text-[11px]">
                                            <table className="w-full text-left font-bold">
                                                <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase border-b">
                                                    <tr><th className="px-10 py-6">Member</th><th className="px-10 py-6 text-center">ID</th><th className="px-10 py-6 text-center">Shift Schedule</th><th className="px-10 py-6 text-right">Actions</th></tr>
                                                </thead>
                                                <tbody className="divide-y">
                                                    {profiles.map(p => (
                                                        <tr key={p.id}>
                                                            <td className="px-10 py-6 text-base text-slate-900 font-black">{p.full_name}</td>
                                                            <td className="px-10 py-6 font-mono text-[#f37021] text-center tracking-[0.4em] font-black">{p.display_id}</td>
                                                            <td className="px-10 py-6 text-center"><div className="inline-block bg-slate-100 px-4 py-2 rounded-2xl text-slate-600 font-mono font-black">{p.shift_start || '--:--'} → {p.shift_end || '--:--'}</div></td>
                                                            <td className="px-10 py-6 text-right flex justify-end gap-3">
                                                                <button onClick={()=>setEditStaff(p)} className="p-4 bg-slate-50 text-slate-600 rounded-2xl btn-3d shadow-sm border"><i data-lucide="edit"></i></button>
                                                                <button onClick={() => handleRegisterFinger(p)} className={`p-4 rounded-2xl btn-3d shadow-sm border ${p.fingerprint_id ? 'bg-emerald-500 text-white shadow-[0_4px_0px_#065f46]' : 'bg-slate-50 text-slate-400'}`}><i data-lucide="fingerprint"></i></button>
                                                                <button onClick={async ()=>{if(confirm(`Permanently delete ${p.full_name}?`)){await sb.from('profiles').delete().eq('id',p.id); refreshData();}}} className="p-4 bg-red-100 text-red-600 rounded-2xl btn-3d shadow-sm border border-red-200"><i data-lucide="trash-2"></i></button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </main>
                        </div>
                    )}

                    {/* MODALS */}
                    {isStaffModal && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-[100] flex items-center justify-center p-6 animate-fade text-center">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-md shadow-2xl">
                                <h3 className="text-3xl font-black mb-8 italic text-[#8b0000] uppercase">Register Staff</h3>
                                <div className="space-y-6 text-left">
                                    <input placeholder="Name" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-bold outline-none" value={newStaff.name} onChange={e=>setNewStaff({...newStaff, name:e.target.value})} />
                                    <input placeholder="PIN" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-mono outline-none" value={newStaff.id} onChange={e=>setNewStaff({...newStaff, id:e.target.value})} />
                                    <input placeholder="Rate" type="number" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none" value={newStaff.rate} onChange={e=>setNewStaff({...newStaff, rate:e.target.value})} />
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="text-left"><label className="text-[10px] font-black uppercase ml-4">Start</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none" value={newStaff.shift_start} onChange={e=>setNewStaff({...newStaff, shift_start:e.target.value})} /></div>
                                        <div className="text-left"><label className="text-[10px] font-black uppercase ml-4">End</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none" value={newStaff.shift_end} onChange={e=>setNewStaff({...newStaff, shift_end:e.target.value})} /></div>
                                    </div>
                                    <div className="flex gap-4 pt-6"><button onClick={()=>setIsStaffModal(false)} className="flex-1 text-slate-400 uppercase text-xs font-black">Cancel</button><button onClick={async ()=>{ await sb.from('profiles').insert([{full_name:newStaff.name, display_id:newStaff.id, daily_rate:newStaff.rate, shift_start:newStaff.shift_start, shift_end:newStaff.shift_end}]); refreshData(); setIsStaffModal(false); }} className="flex-1 py-6 bg-[#f37021] text-white font-black rounded-[2rem] btn-3d shadow-[0_6px_0_#b34e12] uppercase text-xs">Activate</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editStaff && (
                        <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-[100] flex items-center justify-center p-6 animate-fade text-center">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-md shadow-2xl">
                                <h3 className="text-3xl font-black mb-8 italic text-[#8b0000] uppercase">Update Staff</h3>
                                <div className="space-y-6 text-left">
                                    <div className="text-left"><label className="text-[10px] font-black uppercase ml-4">Full Name</label><input className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] font-bold outline-none" value={editStaff.full_name} onChange={e=>setEditStaff({...editStaff, full_name:e.target.value})} /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="text-left"><label className="text-[10px] font-black uppercase ml-4">Shift Start</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none" value={editStaff.shift_start || ''} onChange={e=>setEditStaff({...editStaff, shift_start:e.target.value})} /></div>
                                        <div className="text-left"><label className="text-[10px] font-black uppercase ml-4">Shift End</label><input type="time" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none" value={editStaff.shift_end || ''} onChange={e=>setEditStaff({...editStaff, shift_end:e.target.value})} /></div>
                                    </div>
                                    <div className="flex gap-4 pt-6"><button onClick={()=>setEditStaff(null)} className="flex-1 text-slate-400 uppercase text-xs font-black">Cancel</button><button onClick={async ()=>{ await sb.from('profiles').update({full_name:editStaff.full_name, shift_start:editStaff.shift_start, shift_end:editStaff.shift_end}).eq('id', editStaff.id); setEditStaff(null); refreshData(); }} className="flex-1 py-6 bg-indigo-600 text-white font-black rounded-[2rem] btn-3d shadow-[0_6px_0_#3730a3] uppercase text-xs">Save Changes</button></div>
                                </div>
                            </div>
                        </div>
                    )}

                    {editLog && (
                        <div className="fixed inset-0 bg-[#0F172A]/90 backdrop-blur-xl z-[100] flex items-center justify-center p-6 animate-fade text-center">
                            <div className="glass-bubble p-12 rounded-[4rem] w-full max-w-lg shadow-2xl">
                                <h3 className="text-3xl font-black mb-10 italic text-[#8b0000] uppercase">Override Record</h3>
                                <div className="space-y-10 text-left font-bold italic">
                                    <div className="space-y-2"><label className="text-[10px] uppercase font-black">Clock-In</label><input type="datetime-local" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none" value={toLocalISO(editLog.check_in)} onChange={e=>setEditLog({...editLog, check_in: new Date(e.target.value).toISOString()})} /></div>
                                    <div className="space-y-2"><div className="flex justify-between items-center"><label className="text-[10px] uppercase font-black">Clock-Out</label>{editLog.check_out && <button onClick={() => setEditLog({...editLog, check_out: null})} className="text-[10px] text-red-500 uppercase font-black underline">Return to Live</button>}</div><input type="datetime-local" className="w-full p-6 bg-slate-50 border-2 rounded-[2rem] outline-none" value={editLog.check_out ? toLocalISO(editLog.check_out) : ''} onChange={e=>setEditLog({...editLog, check_out: e.target.value ? new Date(e.target.value).toISOString() : null})} /></div>
                                    <div className="flex gap-6 pt-6"><button onClick={()=>setEditLog(null)} className="flex-1 text-slate-400 uppercase text-xs font-black">Discard</button><button onClick={async ()=>{await sb.from('attendance').update({check_in: editLog.check_in, check_out: editLog.check_out}).eq('id', editLog.id); setEditLog(null); refreshData();}} className="flex-1 py-6 bg-indigo-600 text-white font-black rounded-[2.5rem] btn-3d uppercase text-xs shadow-[0_6px_0px_#3730a3]">Update Record</button></div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
